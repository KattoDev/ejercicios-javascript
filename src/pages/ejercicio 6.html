<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ejercicio 1</title>
    </head>
    <body>
        <header></header>
        <main>
            <div class="container" id="ejercicio-6">
                <details>
                    <summary>Explicación</summary>
                    <p>
                        Escribe una función que determine si un número dado es
                        primo. Un número primo es aquel que solo es divisible
                        por 1 y por sí mismo.
                    </p>
                </details>

                <div class="container">
                    <div class="mb-3">
                        <label for="name" class="form-label">Numero</label>
                        <input
                            type="number"
                            class="form-control"
                            id="primNum"
                        />
                    </div>
                    <button type="button" class="btn btn-success" id="isPrim">
                        Saber si es primo
                    </button>
                </div>
            </div>
        </main>
        <footer></footer>

        <script type="module" src="../js/ejercicios/e6.js"></script>
        <script src="../js/loadcomponents.js"></script>
    </body>
</html>
